# JVM & Build Performance
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX & R Class Configuration
android.useAndroidX=true
android.nonTransitiveRClass=true

# Built-in Kotlin support
android.builtInKotlin=true

# R8 & Baseline Profile Optimizations
android.enableR8.fullMode=true
android.experimental.art-profile-r8-rewriting=true

# 16 KB page alignment for native libraries (Android 15+)
android.build.pageAlignNativeLibs=true

# Gradle 9.4+ build features
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true
android.newDsl=false