name: Android CI & Release Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture-and-lint:
    name: Architecture Hygiene & Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify zero split-packages & module architecture boundaries
        run: ./gradlew verifyZeroSplitPackages :core:engine-api:verifyModuleArchitecture :core:security:verifyModuleArchitecture :core:engine-media:verifyModuleArchitecture :core:engine-database:verifyModuleArchitecture :core:engine-document:verifyModuleArchitecture :features:office:verifyModuleArchitecture :features:cadvector:verifyModuleArchitecture :features:archives:verifyModuleArchitecture :features:gpl-engines:verifyModuleArchitecture :app:verifyModuleArchitecture

      - name: Run Android Lint across flavors
        run: ./gradlew :app:lintGooglePlayDebug :app:lintStandaloneDebug :app:lintVitalGooglePlayRelease :app:lintVitalStandaloneRelease

  unit-tests:
    name: Unit & Robolectric Test Suite (All 10 Modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests across all modules and flavors
        run: ./gradlew testDebugUnitTest --no-daemon --max-workers=2

      - name: Upload JUnit XML test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: "**/build/test-results/test*UnitTest/*.xml"

  release-and-play-compliance:
    name: R8 Release Builds, Play Isolation & 16KB ELF Alignment
    runs-on: ubuntu-latest
    needs: [ architecture-and-lint, unit-tests ]
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate ephemeral signing key for CI verification if absent
        run: |
          if [ ! -f keystore.properties ]; then
            keytool -genkeypair -v \
              -keystore ci-release.jks \
              -alias ci_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cistorepass \
              -keypass cistorepass \
              -dname "CN=FullFileStudio CI,O=FullFileStudio,C=PL"
            cat > keystore.properties <<PROPS
          storeFile=ci-release.jks
          storePassword=cistorepass
          keyAlias=ci_key
          keyPassword=cistorepass
          PROPS
          fi

      - name: Assemble GooglePlay & Standalone Release APKs and AAB
        run: ./gradlew :app:assembleGooglePlayRelease :app:assembleStandaloneRelease :app:bundleGooglePlayRelease

      - name: Verify Google Play binary isolation, ART Baseline Profile, and 16KB ELF alignment
        run: python3 scripts/verify_play_isolation_and_alignment.py
