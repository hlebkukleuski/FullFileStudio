# JVM & Build Performance
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

# AndroidX & R Class Configuration
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=true

# R8 & Baseline Profile Optimizations
android.enableR8.fullMode=true
android.experimental.art-profile-r8-rewriting=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true

# 16 KB page alignment for native libraries (Android 15+)
android.build.pageAlignNativeLibs=true

# AGP 9.4+ Modern DSL & Dependency Constraints
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
